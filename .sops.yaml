keys:
  age:
    - &ssh      "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYGbacmgagiCFB/xB1tordQsYbDoT1Fge4VNK5ybYXc ssh@genesis"
    - &akiko    age13elz7mxhqn7vpmskfltle4tg0skk6jxaa9dzlyc8efpmfcde79pq35el55
    - &phuong   age1w7twg5vdlmysah6aewz5yd3qxuqfpj9fcn3gwdp7zal6k2kxgcuqdyg7qn
    - &sunra    age1hq65xuspp4casafnmpp8ytutgzek2wxtce3r5rvclmdfwffv5g0sl35xrg
    - &tamao    age157ku7r729up3fvtaxxhh67ucrk2wteh8k86j7kg3qnw9r4n99cxqpzrztu

# all secrets can be open with gpg and ssh key
# general secret can be open by any individual key
# individual secret can be open by individual key
creation_rules:
  - path_regex: secrets/general.yaml$
    key_groups:
      - age:
        # per-device keys
        - *akiko
        - *phuong
        - *sunra
        - *tamao

        # cover-all keys
        - *ssh

  - path_regex: secrets/desktop.yaml$
    key_groups:
      - age:
        - *akiko
        - *ssh

  - path_regex: secrets/akiko.yaml$
    key_groups:
      - age:
        - *akiko
        - *ssh

  - path_regex: secrets/phuong.yaml$
    key_groups:
      - age:
        - *phuong
        - *ssh

  - path_regex: secrets/sunra.yaml$
    key_groups:
      - age:
        - *sunra
        - *ssh

  - path_regex: secrets/tamao.yaml$
    key_groups:
      - age:
        - *tamao
        - *ssh

