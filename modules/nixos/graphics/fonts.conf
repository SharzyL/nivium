<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- enable ss03 for Inter -->
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Inter Variable</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>ss03 on</string>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Inter</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>ss03 on</string>
    </edit>
  </match>

  <!-- enable palt for Noto Sans CJK -->
  <!-- disabled since it breaks han-css-q -->
  <!-- <match target="font"> -->
  <!--   <test name="family" compare="contains"> -->
  <!--     <string>Noto Sans CJK</string> -->
  <!--   </test> -->
  <!--   <edit name="fontfeatures" mode="append"> -->
  <!--     <string>palt on</string> -->
  <!--   </edit> -->
  <!-- </match> -->
  <!-- <match target="font"> -->
  <!--   <test name="family" compare="contains"> -->
  <!--     <string>Noto Serif CJK</string> -->
  <!--   </test> -->
  <!--   <edit name="fontfeatures" mode="append"> -->
  <!--     <string>palt on</string> -->
  <!--   </edit> -->
  <!-- </match> -->

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family">
      <string>Noto Sans CJK SC</string>
    </test>
    <edit name="family" binding="strong">
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja-JP</string>
    </test>
    <test name="family">
      <string>Noto Sans CJK SC</string>
    </test>
    <edit name="family" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
</fontconfig>

